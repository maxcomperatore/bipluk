name: Recurring Marketing Campaign Cron (3x per Week)

on:
  workflow_dispatch:

jobs:
  send-marketing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests jinja2 psycopg2-binary python-dotenv

      - name: Dispatch sequential storytelling marketing emails via Resend
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET_KEY: ${{ secrets.SESSION_SECRET_KEY }}
        run: python scripts/send_marketing_campaigns.py 2
